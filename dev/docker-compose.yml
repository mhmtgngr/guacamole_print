# ==================== DOCKER COMPOSE FOR GUACAMOLE WITH PRINT AGENT ====================
# Production-ready Docker Compose setup with file transfer and print interception

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: guacamole-db-print
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: guacamole_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - guacamole-network
    restart: unless-stopped

  # Guacamole daemon (guacd) - handles RDP/VNC connections
  guacd:
    build:
      context: .
      dockerfile: Dockerfile.guacd-patched
    image: guacd-patched-simple:1.0.0
    container_name: guacamole-daemon-print
    environment:
      GUACD_LOG_LEVEL: debug
    volumes:
      - guacd-drive:/tmp/guac-drive
    networks:
      - guacamole-network
    restart: unless-stopped

  # Guacamole web application
  guacamole:
    build:
      context: .
      dockerfile: Dockerfile.aggressive-print
    container_name: guacamole-web-print
    environment:
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole_user
      POSTGRESQL_PASSWORD: guacamole_pass
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - guacd
    networks:
      - guacamole-network
    restart: unless-stopped

volumes:
  postgres_data:
  guacd-drive:

networks:
  guacamole-network:
    driver: bridge