# Docker Compose for Guacamole with Print Agent v4.0
# Run: docker-compose up -d --build

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: guac-print-db
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: guacamole_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - guac-network
    restart: unless-stopped

  # Init container to fix drive permissions (guacd runs as UID 1000)
  guacd-init:
    image: guacamole/guacd:latest
    container_name: guac-drive-init
    user: root
    entrypoint: sh -c "chown -R 1000:1000 /drive && chmod -R 777 /drive"
    volumes:
      - ./drive:/drive

  # Guacamole daemon (guacd)
  guacd:
    image: guacamole/guacd:latest
    container_name: guac-print-daemon
    volumes:
      - ./drive:/drive
    depends_on:
      guacd-init:
        condition: service_completed_successfully
    networks:
      - guac-network
    restart: unless-stopped

  # Guacamole web application with print interception
  guacamole:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guac-print-web
    environment:
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole_user
      POSTGRESQL_PASSWORD: guacamole_pass
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - guacd
    networks:
      - guac-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  guac-network:
    driver: bridge
