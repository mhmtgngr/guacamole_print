# ==================== DOCKER COMPOSE FOR GUACAMOLE WITH PRINT AGENT ====================
# Production-ready Docker Compose setup with integrated WebSocket print agent server

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: guacamole-db-print
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: guacamole_pass
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - guacamole-network
    restart: unless-stopped
    command: postgres -c password_encryption=md5

  # Guacamole daemon (guacd)
  guacd:
    image: guacamole/guacd:latest
    container_name: guacamole-daemon-print
    networks:
      - guacamole-network
    restart: unless-stopped

  # Guacamole web application
  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole-web-print
    environment:
      POSTGRES_HOSTNAME: postgres
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: guacamole_pass
      GUACD_HOSTNAME: guacd
      # Use MD5 authentication instead of SCRAM
      POSTGRES_AUTH_METHOD: md5
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - guacd
      - print-agent
    networks:
      - guacamole-network
    restart: unless-stopped

  # Print Agent WebSocket server
  print-agent:
    build:
      context: .
      dockerfile: Dockerfile.print-agent
    container_name: guacamole-print-agent
    ports:
      - "8182:8182"
    networks:
      - guacamole-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').createServer().listen(3000).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  guacamole-network:
    driver: bridge