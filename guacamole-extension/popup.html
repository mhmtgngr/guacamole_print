<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guacamole Print Agent</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            width: 350px;
            min-height: 400px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .popup-container {
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .status-section {
            margin-bottom: 20px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f8f9fa;
        }
        
        .status-label {
            font-weight: 500;
            color: #495057;
        }
        
        .status-value {
            color: #666;
            font-size: 13px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        
        .status-connected { background-color: #28a745; }
        .status-disconnected { background-color: #dc3545; }
        
        .stats-section {
            margin-bottom: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .stat-item {
            text-align: center;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 6px;
        }
        
        .stat-number {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        
        .actions-section {
            margin-bottom: 20px;
        }
        
        .action-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        
        .action-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .action-btn.secondary {
            background-color: #e9ecef;
            color: #495057;
        }
        
        .action-btn:hover {
            opacity: 0.9;
        }
        
        .footer {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <div class="header">
            <h1>
                🖨️ Guacamole Print Agent
            </h1>
        </div>
        
        <div class="status-section">
            <div class="status-item">
                <span class="status-label">
                    <span id="connectionStatus" class="status-dot status-disconnected"></span>
                    Connection
                </span>
                <span id="connectionText" class="status-value">Disconnected</span>
            </div>
            <div class="status-item">
                <span class="status-label">Agent Version</span>
                <span id="agentVersion" class="status-value">Unknown</span>
            </div>
        </div>
        
        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-item">
                    <div id="todayCount" class="stat-number">0</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-item">
                    <div id="weekCount" class="stat-number">0</div>
                    <div class="stat-label">This Week</div>
                </div>
            </div>
        </div>
        
        <div class="actions-section">
            <button id="testConnection" class="action-btn primary">Test Connection</button>
            <button id="viewHistory" class="action-btn secondary">View History</button>
            <button id="openSettings" class="action-btn secondary">Settings</button>
        </div>
        
        <div class="footer">
            Version 1.0.0 • Made with ❤️ for Guacamole
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
